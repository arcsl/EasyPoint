<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Generador DXF</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/index.css">

    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">

    <script src="./js/basicosDXF.js"></script>
    <script src="./js/bloquesDXF.js"></script>
    <script src="./js/dispositivos.js"></script>
    <script src="./js/simbolos.js"></script>
    <script src="./js/index.js" defer></script>

<body>

    <div class="w3-margin w3-card-4 container w3-white w3-animate-opacity">

        <header class="w3-container w3-theme">
            <h2><i class="w3-margin-right fa fa-cube"></i>Generador DXF</h2>
        </header>

        <div class="w3-container w3-padding" style="width:700px;">

            <p>Completa los datos para generar el archivo DXF:</p>

            <div class="w3-row-padding">
                <div class="w3-padding-small">
                    <input class="w3-input w3-border" id="Inst" placeholder="Nombre Instalación">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Dibu" placeholder="Dibujado">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Clie" placeholder="Cliente">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input type="date" class="w3-input w3-border" id="Fech">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Loca" placeholder="Localidad">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Revi" placeholder="Revisado">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Stye" placeholder="Sustituye a">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Esqu" placeholder="Nº esquema">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Stdo" placeholder="Sustituido por">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-col s12">
                    <button id="btnImportarListado" class="w3-button w3-orange w3-round w3-small botonAniadir">
                        <i class="fa fa-upload"></i> Importar Señales
                    </button>
                    <button id="btnResetEstado" class="w3-button w3-red w3-round w3-small botonAniadir">
                        <i class="fa fa-trash"></i> Borrar proyecto
                    </button>
                    <input type="file" id="inputImportarListado" accept=".json" style="display:none">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-col s12">
                    <button id="btnAddCarril" class="w3-button w3-green w3-round w3-small botonAniadir">
                        <i class="fa fa-plus"></i> Añadir Carril
                    </button>
                </div>
            </div>

            <div class="w3-row-padding">

                <div class="w3-col s12">

                    <!-- Contenedor carriles -->
                    <div id="CarrilesContenedor"></div>

                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-col s12">
                    <div id="CarrilesSenialesCont"></div>
                </div>
            </div>

            <div class="w3-center w3-padding-16">
                <button class="w3-button w3-theme w3-hover-blue w3-xlarge w3-round-large" onclick="descargarDXF()">
                    <i class="fa fa-download"></i>Generar DXF
                </button>
            </div>
        </div>

        <footer class="w3-container w3-theme-l2 w3-center">
            <p>Cajetinador © 2025</p>
        </footer>
    </div>

</body>

</html>
