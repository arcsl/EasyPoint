<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Generador DXF</title>

    <!-- Estilo W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="%23007bff" d="M384 121.941V384c0 35.346-28.654 64-64 64H128c-35.346 0-64-28.654-64-64V128c0-35.346 28.654-64 64-64h195.059L384 121.941zM224 160c-70.692 0-128 57.308-128 128s57.308 128 128 128 128-57.308 128-128S294.692 160 224 160zM224 352c-35.29 0-64-28.71-64-64s28.71-64 64-64 64 28.71 64 64 64z"/></svg>'>

    <script src="basicosDXF.js"></script>
    <script src="bloquesDXF.js"></script>
    <script src="controladores.js"></script>
    <script src="simbolos.js"></script>

    <style>
        body {
            background-color: #f2f2f2;
        }

        select.dispSelect {
            width: 120px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .w3-input {
            margin-bottom: 10px;
        }

        .pagina-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .pagina-label {
            display: inline-block;
            width: 80px;
            /* ancho fijo */
            font-weight: 600;
        }

        .btn-delete-pagina {
            width: 32px;
            height: 32px;
            text-align: center;
            padding: 0;
            line-height: 32px;
        }

        .btn-move {
            width: 32px;
            height: 32px;
            margin-right: 4px;
            padding: 0;
        }
    </style>
</head>

<body>

    <div class="w3-card-4 container w3-white w3-animate-opacity">
        <header class="w3-container w3-theme">
            <h2><i class="w3-margin-right fa fa-cube"></i>Generador DXF</h2>
        </header>

        <div class="w3-container w3-padding">

            <p>Completa los datos para generar el archivo DXF:</p>

            <div class="w3-row-padding">
                <div class="w3-padding-small">
                    <input class="w3-input w3-border" id="Inst" placeholder="Nombre Instalación">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Dibu" placeholder="Dibujado">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Clie" placeholder="Cliente">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input type="date" class="w3-input w3-border" id="Fech">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Loca" placeholder="Localidad">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Revi" placeholder="Revisado">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Stye" placeholder="Sustituye a">
                </div>
            </div>


            <div class="w3-row-padding">
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Esqu" placeholder="Nº esquema">
                </div>
                <div class="w3-half">
                    <input class="w3-input w3-border" id="Stdo" placeholder="Sustituido por">
                </div>
            </div>


            <p>Páginas</p>
            <div class="w3-row-padding">
                <div class="w3-col s12">

                    <!-- Contenedor donde irán las páginas -->
                    <div id="PaginasContenedor" class="w3-margin-bottom"></div>

                    <!-- Botón para añadir páginas -->
                    <button id="btnAddPagina" class="w3-button w3-green w3-round w3-small w3-hover-dark-green">
                        <i class="fa fa-plus"></i> Añadir página
                    </button>
                </div>
            </div>


            <div class="w3-center w3-padding-16">
                <button class="w3-button w3-theme w3-hover-blue w3-xlarge w3-round-large" onclick="descargarDXF()">
                    <i class="fa fa-download w3-margin-right"></i>Generar DXF
                </button>
            </div>
        </div>

        <footer class="w3-container w3-theme-l2 w3-center">
            <p>Cajetinador © 2025</p>
        </footer>
    </div>

    <script>


        /* ------------------------- REFERENCIAS AL DOM EN OBJETO UI ------------------------- */
        const UI = {};
        document.querySelectorAll("[id]").forEach(el => UI[el.id] = el);

        UI.btnAddPagina.onclick = function () {

            const cont = UI.PaginasContenedor;

            // contenedor del bloque
            const bloque = document.createElement("div");
            bloque.className = "bloque-paginas";

            // función para crear una fila dentro del bloque
            const addFila = (isMain, ctrlName = "") => {
                const fila = document.createElement("div");
                fila.className = "pagina-row";

                // eliminar bloque entero desde la fila principal
                const btnDel = document.createElement("button");
                btnDel.className = "w3-button w3-red w3-round btn-delete-pagina";
                btnDel.innerHTML = `<i class="fa fa-trash"></i>`;
                btnDel.onclick = () => { bloque.remove(); renumerarPaginas(); };
                if (!isMain) btnDel.style.visibility = "hidden";

                // botón mover arriba
                const btnUp = document.createElement("button");
                btnUp.className = "w3-button w3-blue w3-round btn-move";
                btnUp.innerHTML = `<i class="fa fa-arrow-up"></i>`;
                btnUp.onclick = () => moverBloque(bloque, -1);
                if (!isMain) btnUp.style.visibility = "hidden";

                // botón mover abajo
                const btnDown = document.createElement("button");
                btnDown.className = "w3-button w3-blue w3-round btn-move";
                btnDown.innerHTML = `<i class="fa fa-arrow-down"></i>`;
                btnDown.onclick = () => moverBloque(bloque, +1);
                if (!isMain) btnDown.style.visibility = "hidden";

                // label
                const lbl = document.createElement("label");
                lbl.className = "pagina-label";
                lbl.textContent = "Página";

                // selector o texto
                let sel;
                if (isMain) {
                    sel = document.createElement("select");
                    sel.className = "w3-select w3-border w3-round w3-small w3-padding dispSelect";
                    sel.appendChild(new Option("", ""));
                    Object.keys(controladores).forEach(k => sel.appendChild(new Option(k, k)));

                    sel.onchange = () => {
                        const ctrl = sel.value;
                        const paginas = controladores[ctrl]?.Paginas?.length || 1;
                        const hojas = controladores[ctrl]?.Disposicion?.Hojas ?? 1;

                        // borrar filas hijas previas
                        while (bloque.children.length > 1) bloque.removeChild(bloque.lastChild);

                        // borrar sub-selects previos
                        [...fila.querySelectorAll(".sub-equipo")].forEach(e => e.remove());

                        // crear filas hijas (multipáginas)
                        for (let i = 1; i < paginas; i++) addFila(false, ctrl);

                        // si no ocupa toda la hoja, crear primer sub-select
                        if (hojas < 1) crearSelectSubEquipo(fila, hojas);

                        renumerarPaginas();
                    };


                } else {
                    sel = document.createElement("span");
                    sel.className = "w3-small w3-border w3-round";
                    sel.style.display = "inline-block";
                    sel.style.width = "200px";
                    sel.style.height = "32px";
                    sel.style.lineHeight = "32px";
                    sel.style.paddingLeft = "8px";
                    sel.textContent = ctrlName;
                }

                fila.appendChild(btnDel);
                fila.appendChild(btnUp);
                fila.appendChild(btnDown);
                fila.appendChild(lbl);
                fila.appendChild(sel);

                bloque.appendChild(fila);
            };

            // crear primera fila del bloque
            addFila(true);

            cont.appendChild(bloque);
            renumerarPaginas();
        };

        function moverBloque(bloque, dir) {
            const cont = UI.PaginasContenedor;
            const bloques = [...cont.querySelectorAll(".bloque-paginas")];
            const index = bloques.indexOf(bloque);
            const newIndex = index + dir;

            if (newIndex < 0 || newIndex >= bloques.length) return;

            if (dir > 0) {
                cont.insertBefore(bloque, bloques[newIndex].nextSibling);
            } else {
                cont.insertBefore(bloque, bloques[newIndex]);
            }

            renumerarPaginas();
        }

        function renumerarPaginas() {
            const bloques = [...UI.PaginasContenedor.querySelectorAll(".bloque-paginas")];
            let num = 1;
            bloques.forEach(b => {
                [...b.children].forEach(f => {
                    f.querySelector(".pagina-label").textContent = `Página ${num++}`;
                });
            });
            actualizarBotonesMovimiento();
        }

        function actualizarBotonesMovimiento() {
            const bloques = [...UI.PaginasContenedor.querySelectorAll(".bloque-paginas")];

            bloques.forEach((bloque, i) => {
                // primera fila del bloque (la que sí tiene botones visibles)
                const filaPrincipal = bloque.firstElementChild;

                const btnUp = filaPrincipal.querySelector(".fa-arrow-up")?.parentNode;
                const btnDown = filaPrincipal.querySelector(".fa-arrow-down")?.parentNode;

                if (!btnUp || !btnDown) return;

                // reglas
                btnUp.disabled = (i === 0);  // primer bloque
                btnDown.disabled = (i === bloques.length - 1); // último bloque
            });
        }

        function crearSelectSubEquipo(fila, ocupacionActual) {
            const espacioRestante = 1 - ocupacionActual;

            // ver si queda algún equipo que quepa
            const hayOpciones = Object.values(controladores).some(
                c => (c.Disposicion?.Hojas ?? 1) <= espacioRestante
            );

            if (!hayOpciones) return;

            const cont = document.createElement("span");
            cont.className = "sub-equipo";
            cont.style.marginLeft = "8px";

            const sel2 = document.createElement("select");
            sel2.className = "w3-select w3-border w3-round w3-small w3-padding dispSelect";

            sel2.appendChild(new Option("", ""));

            // lista filtrada
            Object.keys(controladores).forEach(k => {
                const hojas = controladores[k]?.Disposicion?.Hojas ?? 1;
                if (hojas <= espacioRestante) sel2.appendChild(new Option(k, k));
            });

            sel2.onchange = () => {
                // cuando cambia, eliminar todos los subs a la derecha
                let next = cont.nextSibling;
                while (next) {
                    if (next.classList?.contains("sub-equipo")) {
                        const temp = next;
                        next = next.nextSibling;
                        temp.remove();
                    } else {
                        next = next.nextSibling;
                    }
                }

                const ctrl = sel2.value;
                const hojas = controladores[ctrl]?.Disposicion?.Hojas ?? 1;
                const nuevoOcupado = ocupacionActual + hojas;

                // si aún cabe, crear otro inmediatamente después
                if (ctrl && nuevoOcupado < 1) {
                    crearSelectSubEquipo(fila, nuevoOcupado);
                }

                renumerarPaginas();
            };

            cont.appendChild(sel2);
            fila.appendChild(cont);
        }



        function descargarDXF() {

            const entities = [];

            // Tomar datos del formulario
            const test = {
                Inst: UI.Inst.value || "-",
                Dibu: UI.Dibu.value || "-",
                Fech: UI.Fech.value || "-",
                Revi: UI.Revi.value || "-",
                Esqu: UI.Esqu.value || "-",
                Clie: UI.Clie.value || "-",
                Loca: UI.Loca.value || "-",
                Stye: UI.Stye.value || "-",
                Stdo: UI.Stdo.value || "-",
                Refe: "-",
                Hoja: "-",
            };

            const numHojas = UI.PaginasContenedor.querySelectorAll(".pagina-label").length;

            // determinar filas y columnas
            let determinado = false;
            let cajetinColumnas = 0;
            while (!determinado) {
                cajetinColumnas++;
                if ((cajetinColumnas * (cajetinColumnas - 1)) >= numHojas) determinado = true;
            }
            let cajetinFilas = Math.ceil(numHojas / cajetinColumnas);

            // Generar cajetines

            const filas = UI.PaginasContenedor.querySelectorAll(".pagina-row");

            for (let numHoja = 0; numHoja < numHojas; numHoja++) {
                let CajetinX = (numHoja % cajetinColumnas) * 420;
                let CajetinY = (cajetinFilas - 1 - (Math.floor(numHoja / cajetinColumnas))) * 300;
                test.Hoja = `${numHoja + 1} - ${numHojas}`;
                entities.push(...cajetin(CajetinX, CajetinY, test));
                const contrSelec = filas[numHoja].querySelector("select")?.value;
                if (contrSelec) entities.push(...dibujarDispositivo(CajetinX, CajetinY, controladores[contrSelec]));
            }

            // Finalizar el archivo
            let dxfContent = wrapDXF(entities);
            dxfContent = quitarCaracteresNoASCII(dxfContent);

            // Descargar
            const blob = new Blob([dxfContent], { type: 'application/dxf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'generado.dxf';
            a.click();
            URL.revokeObjectURL(url);
        }

        function quitarCaracteresNoASCII(texto) {
            return texto
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\x00-\x7F]/g, '');
        }

        function dibujarDispositivo(hojaX, hojaY, dispositivo) {

            const entidades = [];

            // separacion universal entre lineas
            const paso = 4;

            // franjas en la definicion del dispositivo
            const franjas = ["Cinta", "Subcinta", "Simbolos", "Numeracion", "Opcional", "Etiqueta", "Fijo"];

            // desplazamiento en coordenada Y de las lineas transversales
            const despYtransv = {
                L: paso * 1,
                G: paso * 3,
                G0: paso * 4,
                N: paso * 25,
            }

            dispositivo.Paginas.forEach((pagina, indexpag) => {

                // calculo del largo del dispositivo
                const largura = pagina
                    .map(conector => conector.Numeracion.length + 1)
                    .reduce((a, b) => a + b, 0) * paso;

                // centrado del dispositivo en la pagina
                let inX = hojaX + (400 - largura) / 2 + indexpag * 420;
                let inY = hojaY + 236;

                // envolvente del dispositivo
                entidades.push(...hashEnv(inX, inY, largura));

                // nombre del dispositivo
                entidades.push(...[
                    // textoDXF(posX, posY, text,  textsize = 2.5, align = 'ML', rotation = 0, estilo = "Standard", multAncho = 1)
                    textoDXF(inX + 2, inY + 21, dispositivo.Nombre, 3, 'ML', 0, "Negrita"),
                ]);

                // numero de modulo
                const { Familia, Tipo } = dispositivo.Disposicion;
                if (Familia === "PX" && Tipo === "modulo") {
                    entidades.push(...[
                        textoDXF(inX + largura - 5, inY + 21, "#", 3, 'MC', 0, "Negrita"),
                        lineaDXF(inX + largura - 10, inY + 18, inX + largura - 10, inY + 24),
                    ]);
                }

                // lineas transversales de fase, neutro, G y G0
                Object.entries(despYtransv).forEach(([key, value]) => {
                    entidades.push(...[
                        textoDXF(inX - 2, inY - value, key, 2.5, 'MR'),
                        lineaDXF(inX, inY - value, inX + largura, inY - value),
                        textoDXF(inX + largura + 2, inY - value, key, 2.5, 'ML'),
                    ]);
                });

                // rellenar la envolvente con simbolos y numeraciones
                pagina.forEach((conector, index) => {

                    // si es un solo elemento (string) ponerlo en medio de su franja correspondiente
                    franjas.forEach(franja => {
                        if (typeof conector[franja] === "string") {
                            const largoConector = (conector.Numeracion.length + 1) * paso;
                            const posXFranjaCentrada = inX + largoConector / 2;
                            entidades.push(...hasheador(posXFranjaCentrada, inY, conector[franja], franja));
                        }
                    });

                    // Si es un array colocar cada elemento en su posicion
                    for (let i = 0; i < conector.Numeracion.length; i++) {
                        inX += paso;
                        franjas.forEach(franja => {
                            if (Array.isArray(conector[franja])) {
                                entidades.push(...hasheador(inX, inY, conector[franja][i], franja));
                            }
                        });
                    }

                    inX += paso;

                    // añadir separador si no es el ultimo conector
                    if (index + 1 < pagina.length) entidades.push(...hasheador(inX, inY, "#Sep"));

                });

            });

            return entidades;

        }

    </script>

</body>

</html>
