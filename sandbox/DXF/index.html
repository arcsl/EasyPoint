<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Generador DXF</title>

    <!-- Estilo W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="%23007bff" d="M384 121.941V384c0 35.346-28.654 64-64 64H128c-35.346 0-64-28.654-64-64V128c0-35.346 28.654-64 64-64h195.059L384 121.941zM224 160c-70.692 0-128 57.308-128 128s57.308 128 128 128 128-57.308 128-128S294.692 160 224 160zM224 352c-35.29 0-64-28.71-64-64s28.71-64 64-64 64 28.71 64 64 64z"/></svg>'>

    <script src="basicosDXF.js"></script>
    <script src="bloquesDXF.js"></script>
    <script src="controladores.js"></script>
    <script src="simbolos.js"></script>

    <style>
        body {
            background-color: #f2f2f2;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .w3-input {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="w3-card-4 container w3-white w3-animate-opacity">
        <header class="w3-container w3-theme">
            <h2><i class="w3-margin-right fa fa-cube"></i>Generador DXF</h2>
        </header>

        <div class="w3-container w3-padding">

            <p>Completa los datos para generar el archivo DXF:</p>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <label>Referencia</label>
                    <input class="w3-input w3-border" id="Refe" placeholder="1234">
                </div>
                <div class="w3-half">
                    <label>Localización</label>
                    <input class="w3-input w3-border" id="Loca" placeholder="Bilbao">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <label>Cliente</label>
                    <input class="w3-input w3-border" id="Clie" placeholder="Cliente">
                </div>
                <div class="w3-half">
                    <label>Fecha</label>
                    <input type="date" class="w3-input w3-border" id="Fech">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <label>Dibujado por:</label>
                    <input class="w3-input w3-border" id="Dibu" placeholder="Dibujado por">
                </div>
                <div class="w3-half">
                    <label>nº Esquema</label>
                    <input class="w3-input w3-border" id="Esqu" placeholder="S - 12345678 - 1">
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-half">
                    <label>Instalador</label>
                    <input class="w3-input w3-border" id="Inst" placeholder="Ej: Instalaciones ABC">
                </div>
                <div class="w3-half">
                    <label>Número de hojas</label>
                    <input class="w3-input w3-border" id="NumHojas" type="number" min="1" value="4">
                </div>
            </div>

            <div class="w3-center w3-padding-16">
                <button class="w3-button w3-theme w3-hover-blue w3-xlarge w3-round-large" onclick="descargarDXF()">
                    <i class="fa fa-download w3-margin-right"></i>Generar DXF
                </button>
            </div>
        </div>

        <footer class="w3-container w3-theme-l2 w3-center">
            <p>Cajetinador © 2025</p>
        </footer>
    </div>

    <script>

        /* ------------------------- REFERENCIAS AL DOM EN OBJETO UI ------------------------- */
        const UI = {};
        document.querySelectorAll("[id]").forEach(el => UI[el.id] = el);

        function descargarDXF() {
            const entities = [];

            // Tomar datos del formulario
            const test = {
                Refe: document.getElementById("Refe").value || "Sin referencia",
                Hoja: '-',
                Loca: document.getElementById("Loca").value || "Sin localización",
                Clie: document.getElementById("Clie").value || "Sin cliente",
                Fech: document.getElementById("Fech").value || "Sin fecha",
                Dibu: document.getElementById("Dibu").value || "Sin dibujo",
                Esqu: document.getElementById("Esqu").value || "Sin esquema",
                Inst: document.getElementById("Inst").value || "Sin instalador",
            };

            const numHojas = parseInt(document.getElementById("NumHojas").value) || 4;

            // determinar filas y columnas
            let determinado = false;
            let cajetinColumnas = 0;
            while (!determinado) {
                cajetinColumnas++;
                if ((cajetinColumnas * (cajetinColumnas - 1)) >= UI.NumHojas.value * 1) determinado = true;
            }
            let cajetinFilas = Math.ceil(numHojas / cajetinColumnas);

            // Generar cajetines
            for (let i = 1; i <= numHojas; i++) {
                let CajetinX = ((i - 1) % cajetinColumnas) * 420;
                let CajetinY = (cajetinFilas - 1 - (Math.floor((i - 1) / cajetinColumnas))) * 300;
                test.Hoja = `${i} - ${numHojas}`;
                entities.push(...cajetin(CajetinX, CajetinY, test));
            }

            // separacion universal entre lineas
            const paso = 4;

            controladores["PXC5.E24"].Paginas.forEach((pagina, indexpag) => {

                // calculo de las unidades de largo del controlador
                const largura = pagina
                    .map(conector => conector.Numeracion.length + 1)
                    .reduce((a, b) => a + b, 0) * paso;

                // centrado del controlador en la pagina
                let inX = (400 - largura) / 2 + indexpag * 400;
                let inY = 236;

                // envolvente del controlador
                entities.push(...hashEnv(inX, inY, largura));

                // rellenar la envolvente con simbolos y numeraciones
                pagina.forEach((conector, index) => {

                    for (let i = 0; i < conector.Numeracion.length; i++) {

                        inX += paso;
                        if (Array.isArray(conector.Numeracion)) entities.push(...hasheador(inX, inY + 2, conector.Numeracion[i], 2.5));
                        if (Array.isArray(conector.Simbolos)) entities.push(...hasheador(inX, inY + 9, conector.Simbolos[i], 2.5));
                        if (Array.isArray(conector.Subcinta)) entities.push(...hasheador(inX, inY + 15, conector.Subcinta[i], 1.5));
                        console.log(conector.Cinta[i]);
                        if (Array.isArray(conector.Cinta)) entities.push(...hasheador(inX, inY + 17, conector.Cinta[i], 1.5));

                    }

                    inX += paso;

                    // añadir separador si no es el ultimo conector
                    if (index + 1 < pagina.length) entities.push(...hasheador(inX, inY, "#Sep", 0));

                });

            });


            // return;

            // Ejemplo de símbolos (ajusta según tus funciones hashXX)
            // const largo = 360;
            // const inicial = (400 - largo) / 2;
            // entities.push(...hashEnv(inicial, 236, largo));

            // entities.push(...hash52(     40, 150));
            // entities.push(...hash25(     80, 150));
            // entities.push(...hashUD(    120, 150));
            // entities.push(...hashD(     160, 150));
            // entities.push(...hashU(     200, 150));
            // entities.push(...hashPalo(  240, 150));
            // entities.push(...hashGuion( 280, 150));
            // entities.push(...hashSep(   320, 150));
            // entities.push(...hashmD(    360, 150));
            // entities.push(...hashLan(   420, 150));

            // Finalizar el archivo
            let dxfContent = wrapDXF(entities);
            dxfContent = quitarCaracteresNoASCII(dxfContent);

            // Descargar
            const blob = new Blob([dxfContent], { type: 'application/dxf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'generado.dxf';
            a.click();
            URL.revokeObjectURL(url);
        }

        function quitarCaracteresNoASCII(texto) {
            return texto
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\x00-\x7F]/g, '');
        }
    </script>

</body>

</html>
