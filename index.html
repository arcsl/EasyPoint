<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Easy Point – Cálculo de señales de PLC y generador de memoria de control para proyectos HVAC</title>
    <meta name="description" content="Easy Point: herramienta online para realizar cálculos de señales de PLC y generar memorias de control para proyectos de calefacción, climatización y aire acondicionado (HVAC). Ideal para técnicos, instaladores e ingenieros que buscan facilitar la documentación técnica y el análisis funcional.">
    <link rel="canonical" href="https://easypoint.arcsl.com">
    <meta property="og:title" content="Easy Point – Cálculo de señales de PLC y generador de memoria de control para HVAC">
    <meta property="og:description" content="Realiza cálculos y genera documentación profesional para proyectos HVAC con Easy Point, una herramienta útil tanto para instaladores como para estudios de ingeniería. Incluye cálculos de señales de PLC y generación de memorias de control.">
    <meta property="og:url" content="https://easypoint.arcsl.com">
    <meta name="robots" content="index, follow">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>

    <script src="./js/blocks.js"></script>
    <script src="./js/creadorCSV.js"></script>
    <script src="./js/creadorDOCX.js"></script>
    <script src="./js/creadorPDF.js"></script>
    <script src="./js/DXFbasicos.js"></script>
    <script src="./js/DXFbloques.js"></script>
    <script src="./js/DXFdispositivos.js"></script>
    <script src="./js/DXFsimbolos.js"></script>
    <script src="./js/dibujador.js" defer></script>
    <script src="./js/script.js" defer></script>
    <script src="./js/escuchadores.js" defer></script>

    <link rel="icon" type="image/png" href="./images/ARClogo.png">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/overlay.css" />
    <link rel="stylesheet" href="./css/estudio.css" />
    <link rel="stylesheet" href="./css/listado.css" />
    <link rel="stylesheet" href="./css/memoria.css" />
    <link rel="stylesheet" href="./css/dibujar.css" />

</head>

<body>

    <!-- PORTADA -->
    <div class="w3-container w3-display-container seccion" id="portada">

        <!-- Logotipo -->
        <div class="contenidoCentradoH margin-top-8p100">
            <a href="https://www.arcsl.com">
                <img src="./images/ARClogo.png" alt="Logotipo" width="150" height="150">
            </a>
        </div>

        <!-- Titulo -->
        <div class="contenidoCentradoH w3-margin-top">
            <h1 class="portadaTitulo">EASY POINT</h1>
        </div>

        <!-- Botones -->
        <div class="contenidoCentradoH w3-margin-top">
            <button id="portadaNueProyecBtn" class="w3-button w3-green w3-margin-right">Nuevo</button>
            <button id="portadaImpProyecBtn" class="w3-button w3-purple w3-margin-right">Importar</button>
            <button id="portadaAbrProyecBtn" class="w3-button w3-blue" disabled>Abrir</button>
            <input id="portadaImpProyecInput" class="w3-hide" type="file" accept=".json" />
        </div>

        <!-- Input nuevo proyecto -->
        <div class="w3-hide" id="portadaNueProyecCont">
            <div class="contenidoCentradoH w3-margin-top">
                <input id="portadaNueProyecInput" class="w3-input w3-padding w3-margin-right" type="text" placeholder="Nombre del nuevo proyecto">
                <button id="portadaNueProyecCrear" class="w3-button w3-green botonCuadrado">
                    <img src="./images/check.svg" alt="Salir" width="30" height="30">
                </button>
            </div>
            <div class="contenidoCentradoH">
                <label id="portadaNueProyecMsg" class="w3-text-red w3-small w3-hide"></label>
            </div>
        </div>

        <!-- Select proyecto -->
        <div class="contenidoCentradoH w3-margin-top w3-hide" id="portadaSelProyecCont">
            <button id="portadaSelProyecBorrar" class="w3-button w3-red w3-margin-right botonCuadrado">
                <img src="./images/papelera.svg" alt="Salir" width="30" height="30">
            </button>
            <select id="portadaSelProyecSelect" class="w3-select w3-padding w3-margin-right"></select>
            <button id="portadaSelProyecAbrir" class="w3-button w3-green botonCuadrado">
                <img src="./images/entrar.svg" alt="Salir" width="35" height="35">
            </button>
        </div>

        <!-- Boton info para abrir el manual -->
        <a href="https://github.com/arcsl/EasyPoint/blob/main/README.md#easy-point" target="_blank" class="w3-blue manualBtn">
            <img src="./images/info.svg" alt="manual">
        </a>

        <!-- Copyright + Version pie de pagina -->
        <div class="w3-small w3-text-gray w3-right w3-padding-small copyVersion">
            EasyPoint V2.1 - Copyright ARC S.L. - 2025
        </div>

    </div>

    <!-- PROYECTO -->
    <div class="w3-container w3-display-container seccion w3-hide" id="proyecto">

        <!-- Cabecera -->
        <div id="proyectoCabecera" class="w3-top w3-white">
            <!-- Nombre de proyecto y botones de control -->
            <div class="w3-margin-top contenidoFlex">
                <input id="proyectoInputNombre" class="w3-input w3-margin-right" placeholder="Nombre del proyecto" />
                <button id="proyectoSalirBtn" class="w3-button w3-red w3-margin-right botonCuadrado"><img src="./images/salir.svg" alt="Salir"></button>
                <button id="proyectoGuardarBtn" class="w3-button w3-green w3-margin-right botonCuadrado"><img src="./images/guardar.svg" alt="Guardar"></button>
                <button id="proyectoExportarBtn" class="w3-button w3-purple w3-margin-right botonCuadrado"><img src="./images/filedown.svg" alt="Descargar"></button>
                <button id="proyectoSeccionBtn" class="w3-button w3-blue botonCuadrado"><img src="./images/estudio.svg" alt="Seccion"></button>
            </div>
            <!-- Subtitulo Cabecera -->
            <div class="w3-margin-bottom">
                <label id="proyectoLabelSeccion" class="w3-input w3-text-gray">ESTUDIO DE LA INSTALACIÓN</label>
            </div>
        </div>

        <!-- Separador cabecera -->
        <div id="proyectoSepTop"></div>

        <!-- Secciones -->
        <div id="estudioCont" class="w3-margin-bottom"></div>
        <div id="memoriaCont" class="w3-margin-bottom w3-hide"></div>
        <div id="listadoCont" class="w3-margin-bottom w3-hide"></div>
        <div id="dibujarCont" class="w3-margin-bottom w3-hide">

            <h4 class="w3-padding w3-light-gray h4-dibujar">Datos del cajetín</h4>

            <div class="w3-row-padding">
                <input id="Dibu" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Dibujado">
                <input id="Clie" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Cliente">
                <input id="Fech" class="w3-margin-right w3-input w3-border-bottom info-cajetin" type="date">
                <input id="Loca" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Localidad">
                <input id="Revi" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Revisado">
                <input id="Stye" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Sustituye a">
                <input id="Esqu" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Nº esquema">
                <input id="Stdo" class="w3-margin-right w3-input w3-border-bottom info-cajetin" placeholder="Sustituido por">
            </div>

            <h4 class="w3-padding w3-light-gray titulo-dibujar">Topología de equipos</h4>

            <div class="w3-row-padding">
                <div class="w3-col s12 w3-margin-top">
                    <button id="btnAddCarril" class="w3-button w3-green w3-round botonAniadir">+ Carril</button>
                    <label class="w3-margin-left labeltipo"><input checked id="mostrarPX" type="checkbox" class="muestraTipo w3-check">PX</label>
                    <label class="w3-margin-left labeltipo"><input checked id="mostrarSynco" type="checkbox" class="muestraTipo w3-check">Synco</label>
                    <label class="w3-margin-left labeltipo"><input checked id="mostrarRLU" type="checkbox" class="muestraTipo w3-check">RLUs</label>
                    <label class="w3-margin-left labeltipo"><input checked id="mostrarLogo" type="checkbox" class="muestraTipo w3-check">Logo</label>
                </div>
            </div>

            <div class="w3-row-padding">
                <div class="w3-col s12">
                    <div id="CarrilesContenedor"></div>
                </div>
            </div>
        </div>

        <!-- Barra herramientas de seccion -->
        <div id="sectionToolsCont" class="contenidoFlex">
            <select id="sectionToolsSelect" class="w3-select w3-margin-right w3-padding"></select>
            <button id="sectionToolsBtn" class="w3-button w3-green botonCuadrado w3-margin-right"><img src="./images/aniacirc.svg" alt="Añadir"></button>
        </div>

        <!-- Separador pie -->
        <div id="proyectoSepPie"></div>

        <!-- Pie -->
        <div id="proyectoPie" class="w3-bottom w3-white">
            <table class="w3-table w3-bordered w3-pale-green w3-margin-top w3-margin-bottom">
                <thead>
                    <tr>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>TOTAL</th>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- OVERLAY -->
    <div id="overlay" class="w3-hide">

        <div id="overlayPopCustom" class="w3-card w3-hide">

            <div class="w3-padding w3-center">
                <h2 class="w3-margin-bottom">Señales del nuevo elemento</h2>
            </div>

            <table class="w3-table w3-margin-bottom">
                <tbody>
                    <tr id="popCustomLabelTR"></tr>
                    <tr id="popCustomInputTR"></tr>
                </tbody>
            </table>

            <div class="w3-center">
                <button id="popCustomAceptarBtn" class="w3-button w3-green w3-margin">Aceptar</button>
                <button id="popCustomCancelBtn" class="w3-button w3-red w3-margin">Cancelar</button>
            </div>

        </div>

        <div id="overlayPopExport" class="w3-card w3-hide">
            <button id="expPDFBtn" class="w3-button w3-purple botonCuadrado w3-margin-right"><img src="./images/pdf.svg" alt="PDF"></button>
            <button id="expCSVBtn" class="w3-button w3-purple botonCuadrado w3-margin-right"><img src="./images/csv.svg" alt="CSV"></button>
            <button id="expWordBtn" class="w3-button w3-purple botonCuadrado w3-margin-right"><img src="./images/fileword.svg" alt="Word"></button>
            <button id="expDXFBtn" class="w3-button w3-purple botonCuadrado w3-margin-right"><img src="./images/dxf.svg" alt="DXF"></button>
            <button id="expCerrarBtn" class="w3-button w3-red corner" aria-label="Cerrar">✕</button>
        </div>

        <div id="overlayPopSeccion" class="w3-card w3-hide">
            <button id="estudioMostrarBtn" class="w3-button w3-blue botonCuadrado w3-margin-right w3-hide"><img src="./images/estudio.svg" alt="Estudio"></button>
            <button id="memoriaMostrarBtn" class="w3-button w3-blue botonCuadrado w3-margin-right"><img src="./images/book.svg" alt="Memoria"></button>
            <button id="listadoMostrarBtn" class="w3-button w3-blue botonCuadrado w3-margin-right"><img src="./images/listado.svg" alt="Listado"></button>
            <button id="dibujarMostrarBtn" class="w3-button w3-blue botonCuadrado w3-margin-right"><img src="./images/techDraw.svg" alt="Dibujar"></button>
            <button id="crearCerrarBtn" class="w3-button w3-red corner" aria-label="Cerrar">✕</button>
        </div>


    </div>

</body>

</html>
